<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Last Chance | Upload Projects</title>

<!-- Favicon (Flame Logo in URL) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='25 25 150 150'%3E%3Ccircle cx='100' cy='100' r='85' fill='%23050505' stroke='%23FFFFFF' stroke-width='4'/%3E%3Cpath d='M 100 30 C 140 80, 140 155, 100 165 C 60 155, 60 80, 100 30 Z' fill='%23FF5722'/%3E%3Cpath d='M 100 65 C 125 100, 125 155, 100 160 C 75 155, 75 100, 100 65 Z' fill='%23FFC107'/%3E%3Cpath d='M 100 90 C 115 115, 115 148, 100 152 C 85 148, 85 115, 100 90 Z' fill='%23FFFFFF'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Cairo+Play:wght@500&family=Hind+Madurai:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  /* ============================================================
     BASE STYLES & BACKGROUND
  ============================================================ */
  :root {
    --maroon: #420B0B; 
    --gold: #C9A227;
    --gold-2: #E5C76A;
    --cream: #FFF8E7;
    --white: #FFFFFF;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-english: 'Cairo Play', cursive, system-ui, sans-serif; 
    --font-tamil: 'Hind Madurai', sans-serif;
    --font-logo: 'Cairo Play', cursive, system-ui, sans-serif;
  }

  body {
    margin: 0;
    background-color: var(--maroon);
    /* Yellow dots pattern */
    background-image: radial-gradient(circle, rgba(201, 162, 39, 0.25) 1.5px, transparent 1.5px);
    background-size: 40px 40px;
    background-position: center;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    box-sizing: border-box;
  }

  /* ============================================================
     MAIN LAYOUT
  ============================================================ */
  .main-content {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 4rem 2rem;
    box-sizing: border-box;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    margin-bottom: 4rem;
  }

  .header svg {
    width: 65px;
    height: 65px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }

  .gradient-text {
    background: linear-gradient(90deg, var(--cream) 0%, var(--gold-2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: inline-block;
    padding-right: 8px; 
    padding-bottom: 4px;
    font-family: var(--font-logo);
    font-weight: 500;
    font-size: 3rem;
    letter-spacing: -0.02em;
  }

  /* ============================================================
     UPLOAD FORM SECTION
  ============================================================ */
  .upload-section {
    background: rgba(255, 248, 231, 0.03);
    border: 1px solid rgba(201,162,39,0.3);
    border-radius: 16px;
    padding: 3rem;
    margin-bottom: 5rem;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }

  .upload-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }

  .form-group.full-width {
    grid-column: 1 / -1;
  }

  .form-group label {
    font-family: var(--font-english);
    color: var(--gold-2);
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .form-group input, 
  .form-group textarea {
    width: 100%;
    padding: 15px 18px;
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(201,162,39,0.4);
    border-radius: 8px;
    color: var(--white);
    font-family: var(--font-english);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.3s ease, background 0.3s ease;
    box-sizing: border-box;
  }

  .form-group input:focus, 
  .form-group textarea:focus {
    border-color: var(--gold-2);
    background: rgba(0,0,0,0.4);
  }

  .form-group input::placeholder, 
  .form-group textarea::placeholder {
    color: rgba(255, 248, 231, 0.4);
  }

  .form-group textarea {
    resize: vertical;
    min-height: 100px;
  }

  /* File Input Styling */
  .form-group input[type="file"] {
    padding: 12px;
    background: rgba(0,0,0,0.2);
    border: 1px dashed rgba(201,162,39,0.4);
    border-radius: 8px;
    color: var(--white);
    font-family: var(--font-english);
    font-size: 0.95rem;
    cursor: pointer;
    width: 100%;
  }

  .form-group input[type="file"]::file-selector-button {
    background: var(--gold-2);
    color: var(--maroon);
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-family: var(--font-english);
    font-weight: 500;
    cursor: pointer;
    margin-right: 12px;
    transition: background 0.3s ease;
  }

  .form-group input[type="file"]::file-selector-button:hover {
    background: var(--gold);
  }

  .file-list-display {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }

  .file-chip {
    background: rgba(201,162,39,0.15);
    border: 1px solid rgba(201,162,39,0.4);
    color: var(--cream);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-family: var(--font-english);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .file-chip .file-size {
    color: var(--gold-2);
    font-size: 0.75rem;
  }

  .optional-hint {
    font-size: 0.75rem;
    color: rgba(255,248,231,0.4);
    font-family: var(--font-english);
    font-weight: 400;
    margin-left: 6px;
  }

  .submit-btn {
    grid-column: 1 / -1;
    padding: 16px;
    background: var(--gold-2);
    color: var(--maroon);
    border: none;
    border-radius: 50px;
    font-family: var(--font-english);
    font-size: 1.1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 1rem;
  }

  .submit-btn:hover {
    background: var(--gold);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(201,162,39,0.3);
  }

  /* ============================================================
     PROJECT GRID
  ============================================================ */
  .projects-header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .projects-title {
    font-family: var(--font-logo);
    font-size: 3rem;
    font-weight: 500;
    margin: 0 0 1rem 0;
    letter-spacing: -0.02em;
  }

  .projects-divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,162,39,0.6), transparent);
    margin-bottom: 3rem;
  }

  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 2rem;
    width: 100%;
  }

  .project-card {
    background: rgba(255, 248, 231, 0.03);
    border: 1px solid rgba(201,162,39,0.25);
    border-radius: 12px;
    padding: 2rem 1.5rem;
    text-align: center;
    transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 250px;
    position: relative;
  }

  .project-card:hover {
    transform: translateY(-8px);
    border-color: var(--gold);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    background: rgba(255, 248, 231, 0.06);
  }

  /* Delete Button on Card */
  .delete-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid rgba(255, 107, 107, 0.3);
    color: #ff6b6b;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    z-index: 10;
  }

  .delete-btn:hover {
    background: #ff6b6b;
    color: var(--white);
  }

  .project-card h3 {
    font-family: var(--font-english);
    font-size: 1.4rem;
    color: var(--cream);
    margin: 0 0 0.5rem 0;
    font-weight: 500;
  }

  .project-card .subtitle {
    font-family: var(--font-tamil);
    font-size: 0.95rem;
    color: var(--gold-2);
    margin: 0;
    line-height: 1.5;
    font-weight: 500;
  }

  .project-desc {
    font-family: var(--font-english);
    font-size: 0.85rem;
    color: rgba(255, 248, 231, 0.6);
    margin-top: 1rem;
    line-height: 1.6;
    text-align: center;
    flex-grow: 1;
  }

  .view-btn {
    margin-top: 1.5rem;
    padding: 10px 24px;
    background: transparent;
    border: 1px solid var(--gold-2);
    color: var(--gold-2);
    border-radius: 50px;
    text-decoration: none;
    font-family: var(--font-english);
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.3s ease;
    width: 100%;
    box-sizing: border-box;
    display: inline-block;
  }

  .view-btn:hover {
    background: var(--gold-2);
    color: var(--maroon);
  }

  /* Files list inside project card */
  .files-list {
    width: 100%;
    margin-top: 1rem;
    text-align: left;
    border-top: 1px solid rgba(201,162,39,0.15);
    padding-top: 0.8rem;
  }

  .files-label {
    font-family: var(--font-english);
    font-size: 0.8rem;
    color: var(--gold-2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.4rem;
  }

  .file-link {
    display: block;
    color: var(--cream);
    text-decoration: none;
    font-family: var(--font-english);
    font-size: 0.85rem;
    padding: 6px 0;
    border-bottom: 1px solid rgba(201,162,39,0.1);
    transition: color 0.2s ease;
    word-break: break-all;
  }

  .file-link:last-child {
    border-bottom: none;
  }

  .file-link:hover {
    color: var(--gold-2);
  }

  .file-link .file-size {
    color: rgba(255,248,231,0.5);
    font-size: 0.75rem;
    margin-left: 4px;
  }

  /* Empty State */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 4rem 0;
    color: rgba(255, 248, 231, 0.5);
    font-family: var(--font-english);
    font-size: 1.1rem;
  }

  /* ============================================================
     RESPONSIVE ADJUSTMENTS
  ============================================================ */
  @media (max-width: 768px) {
    .upload-form { grid-template-columns: 1fr; }
    .header { flex-direction: column; text-align: center; gap: 1rem; }
    .gradient-text { font-size: 2.5rem; }
    .projects-title { font-size: 2.5rem; }
    .upload-section { padding: 2rem 1.5rem; }
  }
</style>
</head>
<body>

  <div class="main-content">
    
    <!-- Header -->
    <div class="header">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <linearGradient id="fire-outer" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#B71C1C" />
            <stop offset="50%" stop-color="#FF5722" />
            <stop offset="100%" stop-color="#FF9800" />
          </linearGradient>
          <linearGradient id="fire-mid" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#FF5722" />
            <stop offset="60%" stop-color="#FFC107" />
            <stop offset="100%" stop-color="#FFEB3B" />
          </linearGradient>
          <linearGradient id="fire-inner" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#FFC107" />
            <stop offset="50%" stop-color="#FFF59D" />
            <stop offset="100%" stop-color="#FFFFFF" />
          </linearGradient>
          <style>
            @keyframes flicker-outer { 0% { transform: scale(1, 1); } 100% { transform: scale(1.03, 1.06); } }
            @keyframes flicker-mid { 0% { transform: scale(1, 1); } 100% { transform: scale(1.06, 1.1); } }
            @keyframes flicker-inner { 0% { transform: scale(1, 1); opacity: 0.85; } 100% { transform: scale(1.1, 1.15); opacity: 1; } }
            @keyframes pulse-glow { 0% { opacity: 0.3; transform: scale(1); } 100% { opacity: 0.7; transform: scale(1.1); } }
            .flame-outer { transform-origin: 100px 165px; animation: flicker-outer 1.2s infinite alternate ease-in-out; }
            .flame-mid { transform-origin: 100px 160px; animation: flicker-mid 0.9s infinite alternate ease-in-out; }
            .flame-inner { transform-origin: 100px 152px; animation: flicker-inner 0.6s infinite alternate ease-in-out; }
            .glow-bg { transform-origin: 100px 100px; animation: pulse-glow 1.5s infinite alternate ease-in-out; }
          </style>
        </defs>
        <circle cx="100" cy="100" r="85" fill="#050505" stroke="#FFFFFF" stroke-width="2" />
        <circle cx="100" cy="100" r="60" fill="#FF5722" opacity="0.5" filter="url(#glow)" class="glow-bg" />
        <path class="flame-outer" d="M 100 30 C 140 80, 140 155, 100 165 C 60 155, 60 80, 100 30 Z" fill="url(#fire-outer)" filter="url(#glow)"/>
        <path class="flame-mid" d="M 100 65 C 125 100, 125 155, 100 160 C 75 155, 75 100, 100 65 Z" fill="url(#fire-mid)" />
        <path class="flame-inner" d="M 100 90 C 115 115, 115 148, 100 152 C 85 148, 85 115, 100 90 Z" fill="url(#fire-inner)" />
      </svg>
      <h1 class="gradient-text">Upload Projects</h1>
    </div>

    <!-- Upload Form -->
    <div class="upload-section">
      <form id="projectForm" class="upload-form">
        <div class="form-group">
          <label for="projectName">Project Name</label>
          <input type="text" id="projectName" placeholder="e.g. Target the Web" required>
        </div>
        
        <div class="form-group">
          <label for="projectSubtitle">Subtitle / Category</label>
          <input type="text" id="projectSubtitle" placeholder="e.g. Advanced Search Tool" required>
        </div>

        <div class="form-group full-width">
          <label for="projectUrl">Project Link (URL) <span class="optional-hint">— optional if files are attached</span></label>
          <input type="url" id="projectUrl" placeholder="https://example.com">
        </div>

        <div class="form-group full-width">
          <label for="projectFiles">Project Files <span class="optional-hint">— optional if URL is provided (multiple allowed)</span></label>
          <input type="file" id="projectFiles" multiple>
          <div class="file-list-display" id="fileListDisplay"></div>
        </div>

        <div class="form-group full-width">
          <label for="projectDesc">Description</label>
          <textarea id="projectDesc" placeholder="Describe what this project does..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">Add Project</button>
      </form>
    </div>

    <!-- Projects Display Grid -->
    <div class="projects-header">
      <h2 class="projects-title gradient-text">Live Projects</h2>
      <div class="projects-divider"></div>
    </div>

    <div class="projects-grid" id="projectsGrid">
      <!-- Projects will be injected here via JavaScript -->
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const form = document.getElementById('projectForm');
      const grid = document.getElementById('projectsGrid');
      const fileInput = document.getElementById('projectFiles');
      const fileListDisplay = document.getElementById('fileListDisplay');

      // ---------- IndexedDB Setup ----------
      const DB_NAME = 'LastChanceProjectsDB';
      const DB_VERSION = 1;
      const STORE_NAME = 'projects';

      function openDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
            }
          };
          request.onsuccess = (event) => resolve(event.target.result);
          request.onerror = (event) => reject(event.target.error);
        });
      }

      let db;
      try {
        db = await openDB();
      } catch (err) {
        console.error('IndexedDB failed to open:', err);
        grid.innerHTML = '<div class="empty-state">Failed to open database. Please ensure IndexedDB is available.</div>';
        return;
      }

      function getAllProjects() {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const request = store.getAll();
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      function addProject(project) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          const request = store.add(project);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      function deleteProjectById(id) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          const request = store.delete(id);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      }

      // ---------- Object URL Management ----------
      let createdObjectUrls = [];

      function revokeAllObjectUrls() {
        createdObjectUrls.forEach(url => URL.revokeObjectURL(url));
        createdObjectUrls = [];
      }

      // ---------- File Input Preview ----------
      fileInput.addEventListener('change', () => {
        const files = fileInput.files;
        if (!files.length) {
          fileListDisplay.innerHTML = '';
          return;
        }
        fileListDisplay.innerHTML = Array.from(files).map(f =>
          `<span class="file-chip">${escapeHtml(f.name)} <span class="file-size">(${formatSize(f.size)})</span></span>`
        ).join('');
      });

      // ---------- Render Projects ----------
      async function renderProjects() {
        revokeAllObjectUrls();
        grid.innerHTML = '';

        let projects;
        try {
          projects = await getAllProjects();
        } catch (err) {
          console.error(err);
          grid.innerHTML = '<div class="empty-state">Failed to load projects.</div>';
          return;
        }

        if (!projects || projects.length === 0) {
          grid.innerHTML = '<div class="empty-state">No projects uploaded yet. Use the form above to add your first project!</div>';
          return;
        }

        projects.forEach(project => {
          const card = document.createElement('div');
          card.className = 'project-card';

          // Build files list with downloadable links
          let filesHtml = '';
          if (project.files && project.files.length > 0) {
            const links = project.files.map(file => {
              if (!file.blob) return '';
              const url = URL.createObjectURL(file.blob);
              createdObjectUrls.push(url);
              return `<a class="file-link" href="${url}" download="${escapeHtml(file.name)}">📎 ${escapeHtml(file.name)} <span class="file-size">(${formatSize(file.size)})</span></a>`;
            }).filter(Boolean).join('');

            if (links) {
              filesHtml = `<div class="files-list"><div class="files-label">Attached Files</div>${links}</div>`;
            }
          }

          const viewBtnHtml = project.url
            ? `<a href="${escapeHtml(project.url)}" target="_blank" class="view-btn">View Project</a>`
            : '';

          card.innerHTML = `
            <button class="delete-btn" data-id="${project.id}" title="Delete Project">×</button>
            <h3>${escapeHtml(project.name)}</h3>
            <p class="subtitle">${escapeHtml(project.subtitle)}</p>
            <p class="project-desc">${escapeHtml(project.desc)}</p>
            ${filesHtml}
            ${viewBtnHtml}
          `;

          grid.appendChild(card);
        });

        // Attach delete handlers
        grid.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = Number(btn.dataset.id);
            if (confirm('Are you sure you want to delete this project?')) {
              try {
                await deleteProjectById(id);
                await renderProjects();
              } catch (err) {
                console.error(err);
                alert('Failed to delete project.');
              }
            }
          });
        });
      }

      // ---------- Form Submission ----------
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('projectName').value.trim();
        const subtitle = document.getElementById('projectSubtitle').value.trim();
        const url = document.getElementById('projectUrl').value.trim();
        const desc = document.getElementById('projectDesc').value.trim();
        const files = fileInput.files;

        // Validate: at least one of URL or files
        if (!url && files.length === 0) {
          alert('Please provide at least a project link OR one or more files.');
          return;
        }

        const fileEntries = Array.from(files).map(f => ({
          name: f.name,
          type: f.type,
          size: f.size,
          blob: f
        }));

        const newProject = {
          name,
          subtitle,
          url,
          desc,
          files: fileEntries
        };

        try {
          await addProject(newProject);
          form.reset();
          fileListDisplay.innerHTML = '';
          await renderProjects();
        } catch (err) {
          console.error(err);
          alert('Failed to add project. The files may be too large for browser storage.');
        }
      });

      // ---------- Helpers ----------
      function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      }

      function escapeHtml(str) {
        if (str == null) return '';
        const div = document.createElement('div');
        div.textContent = String(str);
        return div.innerHTML;
      }

      // ---------- Initial Render ----------
      await renderProjects();
    });
  </script>
</body>
</html>
